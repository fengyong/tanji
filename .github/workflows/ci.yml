name: CI

on:
  push:
    branches: [main, native-app, tanji-native-hg, tanji-native-ios]
  pull_request:
    branches: [main, native-app, tanji-native-hg, tanji-native-ios]
  workflow_dispatch:

jobs:
  web:
    name: Web (PWA) 回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 单元回归
        run: npm test

      - name: 浏览器端到端冒烟
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/browser-smoke.cjs

  native:
    name: Native (iOS) 回归 + 分支对应校验
    runs-on: ubuntu-latest
    # PR 事件下 github.ref_name 是 "123/merge" 而不是分支名，必须同时判断 base_ref。
    if: github.ref_name == 'native-app' || github.base_ref == 'native-app' || github.ref_name == 'tanji-native-hg' || github.base_ref == 'tanji-native-hg'
    steps:
      - uses: actions/checkout@v4
        with:
          # 漂移校验要拿 main 侧的版本做比对，必须能取到完整历史
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 重建插件桥并校验产物一致
        run: |
          npm run build:plugins
          git diff --exit-code www/cap-plugins.js

      - name: 原生路径回归
        run: npm test

      - name: 浏览器端到端冒烟
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/browser-smoke.cjs

      - name: main / native 漂移校验
        if: github.ref_name == 'native-app' || github.base_ref == 'native-app'
        run: node scripts/check-web-sync.cjs --main-ref origin/main

      - name: HG 构建产物校验
        if: github.ref_name == 'tanji-native-hg' || github.base_ref == 'tanji-native-hg'
        run: node scripts/check-web-sync.cjs --artifact-only

  privacy:
    name: iOS 隐私清单合规
    runs-on: ubuntu-latest
    # HG 与原 TanJi native-app 都需要检查；PR 阶段同样不能跳过。
    if: github.ref_name == 'native-app' || github.base_ref == 'native-app' || github.ref_name == 'tanji-native-hg' || github.base_ref == 'tanji-native-hg'
    steps:
      - uses: actions/checkout@v4

      - name: 隐私清单存在且能被解析
        run: |
          test -f ios/App/App/PrivacyInfo.xcprivacy
          # ubuntu runner 没有 plutil：用自带的 python3 解析 plist（macOS 本机也能跑同一条命令）
          python3 -c 'import plistlib,sys; plistlib.load(open(sys.argv[1],"rb"))' ios/App/App/PrivacyInfo.xcprivacy

      - name: 隐私清单已登记进 Xcode 工程
        run: |
          grep -q "PrivacyInfo.xcprivacy in Resources" ios/App/App.xcodeproj/project.pbxproj
          grep -q "NSPrivacyAccessedAPICategoryFileTimestamp" ios/App/App/PrivacyInfo.xcprivacy
          # 纯本地应用不得声明任何数据收集
          ! grep -q "NSPrivacyCollectedDataTypes</key>[[:space:]]*<array>[[:space:]]*<dict>" ios/App/App/PrivacyInfo.xcprivacy

  privacy-native-ios:
    name: 纯原生 iOS 隐私清单与上架就绪
    runs-on: ubuntu-latest
    # 纯原生版分支（ios/TanjiNative/）的上架前置校验。
    if: github.ref_name == 'tanji-native-ios' || github.base_ref == 'tanji-native-ios'
    steps:
      - uses: actions/checkout@v4

      - name: 隐私清单存在且能被解析
        run: |
          test -f ios/TanjiNative/Resources/PrivacyInfo.xcprivacy
          # ubuntu runner 没有 plutil：用自带的 python3 解析 plist
          python3 -c 'import plistlib,sys; plistlib.load(open(sys.argv[1],"rb"))' ios/TanjiNative/Resources/PrivacyInfo.xcprivacy

      - name: 隐私清单声明了实际命中的受限 API
        run: |
          # 纯原生版二进制引用 _OBJC_CLASS_$_NSUserDefaults，
          # 故必须声明 UserDefaults / CA92.1，否则上传被 ITMS-91053 拒收。
          grep -q "NSPrivacyAccessedAPICategoryUserDefaults" ios/TanjiNative/Resources/PrivacyInfo.xcprivacy
          grep -q "CA92.1" ios/TanjiNative/Resources/PrivacyInfo.xcprivacy
          # 纯本地应用不得声明任何数据收集
          ! grep -q "NSPrivacyCollectedDataTypes</key>[[:space:]]*<array>[[:space:]]*<dict>" ios/TanjiNative/Resources/PrivacyInfo.xcprivacy
          # 不追踪
          grep -q "NSPrivacyTracking</key>[[:space:]]*<false/>" ios/TanjiNative/Resources/PrivacyInfo.xcprivacy

      - name: 上架资产检查（隐私清单 + 图标 + 脚本）
        run: node scripts/check-release-assets.cjs

      - name: 隐私清单已登记进 Xcode 工程（xcodegen 生成后校验）
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/TanjiNative/project.yml
          grep -q "PrivacyInfo.xcprivacy in Resources" ios/TanjiNative/TanjiNative.xcodeproj/project.pbxproj

      - name: 发布脚本语法检查
        run: |
          bash -n scripts/archive-testflight.sh
          bash -n scripts/upload-testflight.sh
          bash -n scripts/check-testflight-ready.sh
