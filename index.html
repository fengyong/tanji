<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>探记 · 点子实验室</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --ink:#1C1C1E; --sub:#8E8E93; --line:#E7E7EC;
    --brand:#FF6A2B; --brand-soft:#FFF1E9;
    --green:#34C759; --green-soft:#EAF9EE;
    --orange:#FF9500; --orange-soft:#FFF5E6;
    --red:#FF3B30;   --red-soft:#FFEBEA;
    --blue:#007AFF;  --blue-soft:#EAF2FF;
    --purple:#AF52DE;--purple-soft:#F4EBFC;
    --r:16px;
  }
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
    background:linear-gradient(155deg,#ECEAF3 0%,#E4E8EF 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:26px 16px;color:var(--ink);user-select:none}
  .stage{display:flex;flex-direction:column;align-items:center;gap:16px}
  .caption{font-size:12.5px;color:#7d7f88;text-align:center;line-height:1.7;max-width:460px}
  .caption b{color:#4c4e58}
  .phone{width:393px;height:min(852px,calc(100vh - 96px));min-height:620px;background:var(--bg);border-radius:52px;
    border:11px solid #101014;box-shadow:0 34px 90px rgba(25,25,45,.38),0 4px 18px rgba(0,0,0,.18);
    position:relative;overflow:hidden;overflow:clip}
  @media (max-width:520px){body{padding:0}.phone{width:100vw;height:100vh;height:100dvh;border:none;border-radius:0;box-shadow:none}.caption{display:none}}
  @media (display-mode: standalone){.statusbar,.island{display:none}.phone{border:none;border-radius:0}.view{padding-top:calc(18px + env(safe-area-inset-top))}.tabbar{padding-bottom:calc(26px + env(safe-area-inset-bottom))}}
  .island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:33px;background:#101014;border-radius:18px;z-index:60}
  .statusbar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 7px;z-index:55;font-size:15px;font-weight:600;pointer-events:none}
  .home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#16161a;opacity:.9;z-index:61;pointer-events:none}
  .view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:60px 16px 108px;display:none;overscroll-behavior:contain;scrollbar-width:none}
  .view::-webkit-scrollbar{display:none}
  .view.active{display:block}
  .eyebrow{font-size:13px;font-weight:600;color:var(--sub);margin-bottom:2px}
  h1.big{font-size:30px;font-weight:800;line-height:1.15}
  .hsub{font-size:13px;color:var(--sub);margin-top:5px}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);margin:18px 2px 8px}
  .card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 1px 2px rgba(20,20,40,.05)}
  .row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:.5px solid var(--line);min-width:0}
  .row:last-child{border-bottom:none}
  .rmain{flex:1;min-width:0}
  .rname{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rsub{font-size:12px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rside{text-align:right;flex-shrink:0}
  .rprice{font-size:15px;font-weight:800}
  .rows{padding:2px 12px}
  .chip{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
  .c-blue{background:var(--blue-soft);color:var(--blue)}.c-purple{background:var(--purple-soft);color:var(--purple)}
  .c-orange{background:var(--orange-soft);color:#E8850A}.c-green{background:var(--green-soft);color:#239648}
  .c-gray{background:#EFEFF3;color:#7a7a82}.c-red{background:var(--red-soft);color:var(--red)}
  .c-ink{background:#1C1C1E;color:#fff}
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:12px;font-size:14.5px;font-weight:700;width:100%}
  .btn:active{opacity:.75;transform:scale(.985)}
  .btn.primary{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(255,106,43,.3)}
  .btn.green{background:var(--green);color:#fff}
  .btn.tint{background:var(--brand-soft);color:var(--brand)}
  .btn.tint-blue{background:var(--blue-soft);color:var(--blue)}
  .btn.tint-green{background:var(--green-soft);color:#239648}
  .btn.ghost{background:#F1F1F5;color:#3a3a40}
  .btn+.btn{margin-top:10px}
  .btn2{display:flex;gap:8px}.btn2 .btn{margin-top:0;flex:1;font-size:13.5px;padding:11px 6px}
  .seg{display:flex;background:#E2E2E8;border-radius:11px;padding:2.5px;gap:2px}
  .seg button{flex:1;border:none;background:transparent;padding:6.5px 2px;font-size:12.5px;font-weight:600;color:#6d6d75;border-radius:9px;font-family:inherit}
  .seg button.on{background:#fff;color:#111;box-shadow:0 1.5px 4px rgba(0,0,0,.13);font-weight:700}
  .frow{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:.5px solid var(--line)}
  .frow label{font-size:14px;font-weight:600;width:76px;flex-shrink:0}
  .frow input,.frow select,.frow textarea{border:none;outline:none;font-size:15px;flex:1;font-family:inherit;background:transparent;color:var(--ink);text-align:right;min-width:0}
  .frow textarea{text-align:left;resize:none;font-size:14px;line-height:1.5}
  .mask{position:absolute;inset:0;background:rgba(15,15,25,.4);opacity:0;pointer-events:none;transition:opacity .28s;z-index:80}
  .mask.show{opacity:1;pointer-events:auto}
  .sheet{position:absolute;inset:0;background:var(--bg);transform:translateY(106%);visibility:hidden;
    transition:transform .34s cubic-bezier(.32,.72,.35,1),visibility 0s linear .34s;z-index:90;display:flex;flex-direction:column}
  .sheet.show{transform:translateY(0);visibility:visible;transition:transform .34s cubic-bezier(.32,.72,.35,1)}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px;flex-shrink:0;background:#fff;border-bottom:.5px solid var(--line)}
  .sheet-title{font-size:17px;font-weight:800}
  .sheet-title .tag{font-size:11px;color:var(--sub);font-weight:600;margin-left:8px}
  .sheet-close{border:none;background:#F1F1F5;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#7a7a82}
  .sheet-close svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  .sheet-body{flex:1;overflow-y:auto;padding:16px 16px 40px;scrollbar-width:none}
  .sheet-body::-webkit-scrollbar{display:none}
  .tabbar{position:absolute;bottom:0;left:0;right:0;height:86px;padding:9px 8px 30px;display:flex;background:rgba(250,250,252,.88);
    -webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border-top:.5px solid rgba(0,0,0,.12);z-index:50}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;font-size:10px;font-weight:600;color:#98989f;font-family:inherit}
  .tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tab.active{color:var(--brand)}
  .toast{position:absolute;top:64px;left:50%;transform:translate(-50%,-12px);z-index:120;background:rgba(28,28,32,.94);color:#fff;
    font-size:13px;font-weight:600;padding:9px 18px;border-radius:22px;opacity:0;pointer-events:none;transition:all .28s;max-width:82%;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .empty{padding:30px 0;text-align:center;color:var(--sub);font-size:13px;line-height:1.8}

  /* 点子卡片 */
  .idea{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:var(--r);padding:14px;box-shadow:0 1px 2px rgba(20,20,40,.05);margin-bottom:10px;cursor:pointer}
  .idea:active{background:#F7F7FA}
  .idea-emoji{font-size:26px;line-height:1;margin-top:2px}
  .idea-main{flex:1;min-width:0}
  .idea-name{font-size:15.5px;font-weight:800}
  .idea-why{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.55}
  .idea-why b{color:#4c4e58}
  .idea-go{margin-top:8px;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--brand)}

  .pbar{height:10px;background:#EFEFF3;border-radius:5px;overflow:hidden}
  .pbar i{display:block;height:100%;background:linear-gradient(90deg,#FF8B55,var(--brand));border-radius:5px}
  .big-num{font-size:34px;font-weight:800;letter-spacing:.3px}
  .txt-card{background:#fff;border:.5px solid var(--line);border-radius:14px;padding:14px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-all}
  .kbd{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .kbd button{border:1.5px solid #E2E2E8;background:#fff;color:#3a3a40;font-size:13px;font-weight:700;padding:8px 14px;border-radius:18px;font-family:inherit}
  .kbd button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .kbd button:active{opacity:.7}
  .chk{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:7px;font-size:13.5px;line-height:1.4}
  .chk input{margin-top:2px;accent-color:var(--brand);width:17px;height:17px;flex-shrink:0}
  .chk.done span{text-decoration:line-through;color:var(--sub)}

  /* 自检 */
  .qa-group{font-size:12px;font-weight:800;color:var(--sub);margin:14px 2px 6px}
  .qa-row{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:10px;margin-bottom:4px;background:#fff;font-size:12.5px;line-height:1.5}
  .qa-ok{color:#239648;font-weight:800;flex-shrink:0}
  .qa-no{color:var(--red);font-weight:800;flex-shrink:0}
  .qa-detail{color:var(--sub);font-size:11.5px}
  .qa-pass{font-size:30px;font-weight:800}

  /* 引导 */
  .urow{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:8px;font-size:13px;line-height:1.5}
  .urow input{margin-top:3px;accent-color:var(--brand);width:16px;height:16px;flex-shrink:0}
  .urow .uauto{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;flex-shrink:0;margin-top:1px}
  .ua-ok{background:var(--green-soft);color:#239648}
  .ua-manual{background:#EFEFF3;color:#7a7a82}
  .uexp{color:var(--sub);font-size:11.5px;margin-top:3px}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="island"></div>
    <div class="statusbar"><span>9:41</span><span style="font-size:12px">点子实验室</span></div>

    <section class="view active" id="v-lab"></section>
    <section class="view" id="v-test"></section>
    <section class="view" id="v-guide"></section>

    <nav class="tabbar">
      <button class="tab active" data-act="tab" data-tab="lab">
        <svg viewBox="0 0 24 24"><path d="M9.5 3h5M10 3v6.5L5.5 17A3 3 0 0 0 8.2 21h7.6a3 3 0 0 0 2.7-4L14 9.5V3"/><path d="M7 14h10"/></svg>8 个点子
      </button>
      <button class="tab" data-act="tab" data-tab="test">
        <svg viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8-7.5 9.5-4.3-1.5-7.5-4.9-7.5-9.5V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg>自检 · 测试
      </button>
      <button class="tab" data-act="tab" data-tab="guide">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="3"/><path d="M8.5 11l2.2 2.2 5-5"/><path d="M8.5 3v3M15.5 3v3"/></svg>达人引导
      </button>
    </nav>

    <div class="mask" id="mask" data-act="close-demo"></div>
    <div class="sheet" id="sheet-demo">
      <div class="sheet-head">
        <span class="sheet-title" id="demo-title"></span>
        <button class="sheet-close" data-act="close-demo"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="sheet-body" id="demo-stage"></div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="home-ind"></div>
  </div>

  <div class="caption">
    <b>探记 · 点子实验室</b>(lab 分支)— 8 个产品点子可交互 demo + 自测试机制<br>
    每个点子附产品论据;自检含「测试工程师断言层」与「达人 UAT 引导层」;数据全部虚构
  </div>
</div>

<script>
/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const now=new Date();
const TODAY=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
function dOff(days,hm='10:00'){const t=new Date(now);t.setDate(t.getDate()+days);return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}T${hm}`}
function nowStr(){const n=new Date();return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}T${pad(n.getHours())}:${pad(n.getMinutes())}`}
function fmtD(s){if(!s)return '—';const d=new Date(s);return `${d.getMonth()+1}-${pad(d.getDate())}`}
function fmtHM(s){return s?s.slice(11,16):'—'}
function fmtMoney(n){return '¥'+Math.round(n).toLocaleString('zh-CN')}
function daysBetween(s){return Math.max(0,Math.floor((now-new Date(s))/864e5))}
function toMin(a){return +a.slice(11,13)*60+ +a.slice(14,16)}
let toastTimer;
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1900)}

/* ================= 实验室虚构数据(不含任何真实商家) ================= */
function labSeed(){
  const O=[];let id=1;const P=[];
  const add=(d,t,store,price,opts={})=>{
    const appt=dOff(d,t);
    const past=new Date(appt)<=now;
    const o={id:id++,store,cat:opts.cat||'餐饮',price,deposit:opts.dep||0,settleVia:opts.douyin?'douyin':'private',
      appt,shotAt:null,submittedAt:null,shortAt:null,longAt:null,depositPaidAt:null,finalPaidAt:null,
      remindAt:null,note:opts.note||'',channel:opts.ch||'直客',partner:opts.pt||''};
    if(past){
      const off=m=>{const x=new Date(appt);x.setMinutes(x.getMinutes()+m);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}T${pad(x.getHours())}:${pad(x.getMinutes())}`};
      if(opts.shotToday){o.shotAt=nowStr()}
      else if(!opts.future){o.shotAt=off(45);o.submittedAt=off(180);o.longAt=off(60*30)}
      if(opts.delivered&&!opts.shotToday){o.shortAt=off(60*26)}
      if(opts.settled){
        o.finalPaidAt=off(60*30);
        if(price>0)P.push({oid:o.id,kind:'尾款',amount:price,at:o.finalPaidAt,method:'微信',note:opts.mode==='X'?'线下结算':null});
      }
    }
    if(opts.dep>0&&opts.depPaid){
      const pd=new Date(appt);pd.setDate(pd.getDate()-1);
      o.depositPaidAt=`${pd.getFullYear()}-${pad(pd.getMonth()+1)}-${pad(pd.getDate())}T18:00`;
      P.push({oid:o.id,kind:'定金',amount:opts.dep,at:o.depositPaidAt,method:'微信'});
    }
    O.push(o);
  };
  add(-20,'11:30','澄川咖啡·滨江店',800,{ch:'蜂向',pt:'花花',settled:true,cat:'咖啡'});
  add(-18,'12:00','黔牛汇(龙华)',300,{ch:'蜂向',settled:true});
  add(-15,'15:00','麓野日料·万象城店',1600,{ch:'小爱',pt:'邱邱',settled:true});
  add(-13,'14:00','TONI 造型沙龙(湖畔店)',1200,{ch:'直客',delivered:true}); // 逾期示例
  add(-12,'18:30','南山眷坊(蛇口)',330,{ch:'食物',settled:true});
  add(-11,'14:00','无刺泡泡',1700,{ch:'直客',pt:'花花',settled:true});
  add(-9,'11:30','澄川咖啡·滨江店',900,{ch:'蜂向',pt:'花花',settled:true,cat:'咖啡'}); // 复购②
  add(-7,'12:30','深圳打铁匠(海雅缤纷城)',1600,{ch:'直客',dep:500,depPaid:true}); // 待尾款
  add(-6,'17:30','鹤乡炭火记(坂田)',300,{ch:'蜂向',settled:true});
  add(-5,'20:30','潮泰社·烧烤音乐餐厅',330,{ch:'食物',pt:'花花',settled:true,cat:'烧烤'});
  add(-4,'11:30','湘村小灶',300,{ch:'蜂向',pt:'邱邱',settled:true});
  add(-3,'12:00','麓野日料·万象城店',1800,{ch:'小爱',pt:'邱邱',settled:true}); // 复购②
  add(-2,'19:30','岳州大叔(坂田)',500,{ch:'直客',pt:'花花'}); // 待尾款
  add(-1,'10:00','喜邻超市·社区店',900,{ch:'食物',douyin:true,delivered:true}); // 平台结算
  add(-1,'19:30','山茶花奶茶·观前街店',1000,{ch:'食物'}); // 发片中
  add(0,'09:30','澄川咖啡·滨江店',800,{ch:'蜂向',pt:'花花',shotToday:true,cat:'咖啡'}); // 今日已拍
  add(0,'14:00','麓野日料·万象城店',1600,{ch:'小爱'}); // 今日待拍
  add(1,'10:30','南栖烘焙(大学城)',900,{ch:'直客',dep:300,depPaid:true});
  add(2,'15:00','拾光汉服体验馆',1500,{ch:'直客'});
  add(4,'13:00','山野咖啡·露台店',1200,{ch:'蜂向',dep:400,depPaid:true});
  add(9,'18:30','云端西餐厅·33楼',2200,{ch:'直客',note:'夜景机位'});
  return {orders:O,payments:P,threshold:15};
}
let db=labSeed();

/* ================= 派生逻辑(与主应用一致) ================= */
function workOf(o){if(!o.shotAt)return '待拍摄';if(!o.submittedAt)return '后期中';if(o.shortAt&&o.longAt)return '已交付';return '发片中'}
function unDep(o){return (!o.depositPaidAt&&o.deposit>0)?o.deposit:0}
function unFin(o){return o.finalPaidAt?0:(o.price-o.deposit)}
function owedOf(o){return unDep(o)+unFin(o)}
function payOf(o){if(o.finalPaidAt)return '已结清';if(unDep(o)>0)return '待定金';if(o.settleVia==='douyin')return '平台结算';return '待尾款'}
function overdueDays(o){if(payOf(o)!=='待尾款')return 0;return daysBetween(o.shotAt||o.appt)}
function snoozed(o){return !!(o.remindAt&&o.remindAt>nowStr())}
function isOver(o){return payOf(o)==='待尾款'&&overdueDays(o)>=db.threshold}
function receivedOf(o){return db.payments.filter(p=>p.oid===o.id).reduce((s,p)=>s+p.amount,0)}
const byId=id=>db.orders.find(o=>o.id===id);
function dayBadge(n,sum){
  if(sum>=2500)return {e:'💎',t:'王牌日'};
  if(n>=5)return {e:'🔥',t:'爆单'};
  if(sum>=1000)return {e:'💰',t:'千元日'};
  if(n>=3)return {e:'⭐',t:'忙碌日'};
  return null;
}

/* ================= 点子定义 ================= */
const IDEAS=[

/* ================= D5 战报生成器 ================= */
let d5Period='week',d5Text='';
function d5Stats(period){
  const days=period==='week'?7:null;
  let start;
  if(days)start=new Date(now.getTime()-864e5*days);
  else start=new Date(now.getFullYear(),now.getMonth(),1);
  const prevStart=new Date(start.getTime()-(days?864e5*days:(now-start)));
  const inWin=t=>t&&new Date(t)>=start&&new Date(t)<=now;
  const inPrev=t=>t&&new Date(t)>=prevStart&&new Date(t)<start;
  const orders=db.orders.filter(o=>inWin(o.appt));
  const paid=db.payments.filter(p=>inWin(p.at)).reduce((s,p)=>s+p.amount,0);
  const pOrders=db.orders.filter(o=>inPrev(o.appt)).length;
  const pPaid=db.payments.filter(p=>inPrev(p.at)).reduce((s,p)=>s+p.amount,0);
  const byDay={};orders.forEach(o=>{const k=o.appt.slice(0,10);if(!byDay[k])byDay[k]={n:0,s:0};byDay[k].n++;byDay[k].s+=o.price});
  let f=0,m=0;Object.values(byDay).forEach(v=>{const b=dayBadge(v.n,v.s);if(b?.e==='🔥')f++;if(b?.e==='💰')m++});
  return {n:orders.length,deal:orders.reduce((s,o)=>s+o.price,0),paid,
    nDelta:pOrders?orders.length-pOrders:null,paidDelta:pPaid?paid-pPaid:null,
    badges:{f,m},periodName:days?'近 7 天':'本月'};
}
function demo5(){
  const st=d5Stats(d5Period);
  const line=st.nDelta===null?`${st.periodName} ${st.n} 单`:`${st.periodName} ${st.n} 单(上期 ${st.pOrders},${st.nDelta>=0?'+':''}${st.nDelta})`;
  d5Text=`📣 探店战报 · ${st.periodName}\n拍摄 ${st.n} 单 · 档期 ${fmtMoney(st.deal)}\n实收 ${fmtMoney(st.paid)}${st.paidDelta!==null?`(环比 ${st.paidDelta>=0?'+':'-'}${fmtMoney(Math.abs(st.paidDelta))})`:''}\n🔥爆单日 ×${st.badges.f} · 💰千元日 ×${st.badges.m}\n继续冲!`;
  $('#demo-stage').innerHTML=`
    <div class="seg">${[['week','近 7 天'],['month','本月']].map(([k,l])=>`<button class="${d5Period===k?'on':''}" data-act="d5-period" data-p="${k}">${l}</button>`).join('')}</div>
    <div class="card" style="margin-top:14px;text-align:center;padding:18px">

      <div style="font-size:12.5px;color:var(--sub)">实收 · 档期 ${fmtMoney(st.deal)} · ${st.n} 单</div>
      <div style="font-size:13px;font-weight:700;margin-top:8px">🔥 爆单日 ×${st.badges.f} · 💰 千元日 ×${st.badges.m}</div>
    </div>
    <div class="sec-title">可发文案</div>
    <div class="txt-card">${d5Text}</div>
    <div style="padding-top:12px"><button class="btn primary" data-act="d5-copy">复制战报</button></div>
    <div class="rsub" style="text-align:center;margin-top:10px">论据:复盘 + 社交激励;环比让「坚持」可见</div>`;

function download(name,content,type){
  const isText=typeof content==='string';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([isText?"\ufeff"+content:content],{type}));
  a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2500);
}

  if(t.dataset.act==='d7-check'){
    const st=d7State[t.dataset.cat];st[+t.dataset.i]=t.checked;
    if(st.every(Boolean))toast('🎉 素材齐了,收工!');
    demo7();
  }
  if(t.dataset.act==='d8-target'){d8Target=+t.value;demo8()}
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,oid=+t.dataset.oid||0;
  switch(act){
    case 'tab':showTab(t.dataset.tab);break;
    case 'open-demo':openDemo(t.dataset.demo);break;
    case 'close-demo':closeDemo();break;
    case 'd1-toggle':d1Toggle(oid);break;
    case 'd1-share':d1Share();break;
    case 'd2-ch':d2Channel=t.dataset.ch;demo2();break;
    case 'd2-copy':copyText(d2Text);break;
    case 'd2-img':d2Img();break;
    case 'd3-oid':d3Oid=oid;demo3();break;
    case 'd3-tone':d3Tone=t.dataset.tone;demo3();break;
    case 'd3-copy':copyText($('#d3-msg').textContent);break;
    case 'd5-period':d5Period=t.dataset.p;demo5();break;
    case 'd5-copy':copyText(d5Text);break;
    case 'd6-ch':d6.ch=t.dataset.ch;demo6();break;
    case 'd6-pt':d6.pt=t.dataset.pt;demo6();break;
    case 'd6-price':$('#d6-price-input').value=t.dataset.v;break;
    case 'd6-save':d6Save();break;
    case 'd7-cat':d7Cat=t.dataset.cat;demo7();break;
    case 'qa-report':{
      const res=runQA();
      const head='组,用例,结果,说明';
      const lines=res.map(r=>[r.g,r.n,r.ok?'PASS':'FAIL',r.detail||''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
      download(`探记-自检报告-${TODAY}.csv`,[head,...lines].join('\n'),'text/csv;charset=utf-8');
      toast('测试报告已导出 ✓');break;
    }
  }
});

/* ================= 启动 ================= */
renderLab();renderTest();renderGuide();
</script>
</body>
</html>
