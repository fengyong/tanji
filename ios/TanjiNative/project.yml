# 探记 · 纯原生 iOS 工程定义（xcodegen）
# 用法：xcodegen generate --spec ios/TanjiNative/project.yml
name: TanjiNative
options:
  bundleIdPrefix: com.ord
  createIntermediateGroups: true
  # 最低支持设备:iPhone 15 Pro(首发系统 iOS 17.0)。
  # 因此 deployment target 锁定 iOS 17.0,不再向下兼容更低机型/更低系统。
  # 代价:可以直接用 iOS 17+ 的 API(如 onChange(of:initial:) 双参版、
  # scrollClipDisabled、Chart 的 plotFrame),不必写 @available 双轨分支。
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  TanjiNative:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - "Info.plist"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 探记 HG
        CFBundleDevelopmentRegion: zh_CN
        # 让「文件」App 出现「探记 HG」文件夹：App 沙盒的 Documents 目录即以显示名呈现
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 只支持 iPhone(TARGETED_DEVICE_FAMILY = 1),不配 iPad 专属方向。
        NSFaceIDUsageDescription: 用于确认是你本人后隐藏或显示探记中的金额。Face ID 信息由系统处理，不会提供给探记。
        NSCameraUsageDescription: 拍一张店铺门口照片，作为「已到店」的标记。照片会压缩保存在本机，并包含在你主动导出的 JSON 备份中，不会上传。
        NSPhotoLibraryUsageDescription: 从相册选择店铺照片或账号头像。照片仅在本机压缩保存，不会上传。
        NSLocationWhenInUseUsageDescription: 到店拍摄时记录一次当时的位置，方便事后回看「这单在哪拍的」并一键导航过去。位置只存本机、不上传，也不参与任何统计。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ord.tanji
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - TanjiNativeTests
        - TanjiNativeUITests

  TanjiNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: TanjiNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ord.tanji.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TanjiNative

  TanjiNativeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: TanjiNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ord.tanji.tests
        GENERATE_INFOPLIST_FILE: YES
